name: Build VSCode Extension

on:
  push:
    branches:
      - main
      - copilot/add-vscode-syntax-highlighting
    paths:
      - 'vscode-extension/**'
  pull_request:
    paths:
      - 'vscode-extension/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package.json
      
      - name: Build VSCode Extension
        run: |
          cd vscode-extension
          chmod +x build.sh
          ./build.sh full
      
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v3
        with:
          name: vscode-extension
          path: vscode-extension/build/*.vsix
          if-no-files-found: error
      
      - name: Display build info
        run: |
          echo "Built packages:"
          ls -lh vscode-extension/build/*.vsix
